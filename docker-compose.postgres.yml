services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: saleslab_local
      POSTGRES_USER: saleslab
      POSTGRES_PASSWORD: saleslab_local_only
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleslab -d saleslab_local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - saleslab-postgres-data:/var/lib/postgresql/data

volumes:
  saleslab-postgres-data:
